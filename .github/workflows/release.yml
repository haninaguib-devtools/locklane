# Publishes a rolling "latest" release of the runnable engine jar on every push to
# main (#95). Deliberately a moving pointer, not a permanent per-version release: the
# project version is still a -SNAPSHOT and does not change across commits, so there is
# no version number to hang a permanent tag on yet (see #98 for that, once the project
# cuts a real version).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# A second push landing while an earlier run is still publishing must not race it for
# the same "latest" release — cancel the older, still-running publish instead.
concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test the engine, then repackage the runnable jar
        run: ./mvnw -B -f engine/pom.xml package

      - name: Stage the jar under its fixed release asset name
        id: stage
        run: |
          # Read the version at build time rather than hardcoding it, so no literal
          # version string ever needs to appear (or drift out of date) in this file.
          version=$(./mvnw -q -f engine/pom.xml help:evaluate \
            -Dexpression=project.version -DforceStdout)

          # engine/pom.xml sets no <finalName>, so Maven's default naming applies:
          # the spring-boot-maven-plugin repackages this jar in place.
          src="engine/target/engine-${version}.jar"
          if [ ! -f "$src" ]; then
            echo "::error::expected jar not found at $src"
            exit 1
          fi
          cp "$src" locklane.jar

          short_sha="${GITHUB_SHA:0:7}"
          title="${version} (build ${GITHUB_RUN_NUMBER} · ${short_sha})"
          echo "title=${title}" >> "$GITHUB_OUTPUT"

      - name: Upsert the rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.stage.outputs.title }}
        run: |
          # Update in place rather than delete-then-create, so the download URL never
          # 404s mid-run. "latest" is a pre-release: it is a moving pointer at the
          # newest build, never a permanent version.
          if gh release view latest --json tagName >/dev/null 2>&1; then
            gh release edit latest --title "$TITLE"
          else
            gh release create latest \
              --title "$TITLE" \
              --notes "Rolling build of the newest commit on main. Not a permanent version — see releases tagged v* for those, once they exist." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          gh release upload latest locklane.jar --clobber
