# Cuts a release on manual dispatch (workflow_dispatch-only since #207). `main` always
# builds toward an `X.Y.Z-SNAPSHOT` version (#463): the maintainer picks the next
# version by editing `<revision>` in the root pom through an ordinary PR, and this
# workflow derives the release version by stripping the `-SNAPSHOT` suffix, builds the
# jar as that bare version, and publishes a permanent release tagged `v<version>` that
# never changes again (#98). It also upserts the rolling "latest" pre-release (#95),
# which always points at the newest build.
name: Release

on:
  workflow_dispatch: {}

permissions:
  contents: read

# A second dispatch landing while an earlier run is still publishing must not race it
# for the same "latest" release — cancel the older, still-running publish instead.
concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Derive the release version from the pom revision
        id: version
        # `<revision>` on main is always `X.Y.Z-SNAPSHOT` (#463,
        # docs/architecture/releasing.md); the release version is that value with the
        # suffix stripped. `${raw%-SNAPSHOT}` is a no-op when the suffix is absent, so
        # a dispatch against an already-bare revision still releases that version —
        # the immutability check below is what protects a version already cut.
        run: |
          raw=$(./mvnw -q -f engine/pom.xml help:evaluate \
            -Dexpression=project.version -DforceStdout)
          version="${raw%-SNAPSHOT}"
          echo "Revision is ${raw}; releasing ${version}."
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and test the engine, then repackage the runnable jar
        # From the root, not `-f engine/pom.xml`: engine depends on the client
        # module, and building engine standalone skips the reactor, so a fresh
        # runner (no client jar in its local repo yet) fails to resolve that
        # dependency. The root build resolves it through the reactor.
        #
        # -Drevision overrides the pom's `X.Y.Z-SNAPSHOT` with the bare release
        # version (Maven CI-friendly versions resolve it reactor-wide), so the
        # published jar identifies itself as the release, never as a SNAPSHOT.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./mvnw -B package -Drevision="$VERSION"

      - name: Stage the jar under its fixed release asset name
        id: stage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # engine/pom.xml sets no <finalName>, so Maven's default naming applies:
          # the spring-boot-maven-plugin repackages this jar in place.
          src="engine/target/engine-${VERSION}.jar"
          if [ ! -f "$src" ]; then
            echo "::error::expected jar not found at $src"
            exit 1
          fi
          cp "$src" locklane.jar

          short_sha="${GITHUB_SHA:0:7}"
          title="${VERSION} (build ${GITHUB_RUN_NUMBER} · ${short_sha})"
          echo "title=${title}" >> "$GITHUB_OUTPUT"

      - name: Upsert the rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.stage.outputs.title }}
        run: |
          # Update in place rather than delete-then-create, so the download URL never
          # 404s mid-run. "latest" is a pre-release: it is a moving pointer at the
          # newest build, never a permanent version.
          if gh release view latest --json tagName >/dev/null 2>&1; then
            gh release edit latest --title "$TITLE"
          else
            gh release create latest \
              --title "$TITLE" \
              --notes "Rolling build of the newest commit on main. Not a permanent version — see releases tagged v* for those, once they exist." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          gh release upload latest locklane.jar --clobber

      - name: Move the "latest" tag to this commit
        # gh release edit's --target is only honored when a tag is first created — once
        # "latest" already exists, editing the release's target does not move it. The
        # tag itself has to be force-moved directly.
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest

      - name: Cut the permanent release for the derived version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${VERSION}"

          # A released version is immutable: a second run against the same version
          # (forgot to bump it, or re-ran a stale workflow) must fail loudly rather
          # than silently overwrite or silently skip.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::release $tag already exists — a released version is immutable; bump <revision> in pom.xml to cut a new one"
            exit 1
          fi

          gh release create "$tag" \
            --title "$tag" \
            --notes "Permanent release of version ${VERSION}." \
            --target "$GITHUB_SHA" \
            locklane.jar
