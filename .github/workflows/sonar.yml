# Code quality and test coverage, on demand only (#399). A maintainer starts this from
# the Actions tab; it builds the project, measures coverage with JaCoCo, and uploads
# both to the project's SonarQube server. It deliberately has no automatic trigger of
# any kind — no push, no pull_request, no schedule — so it can never make a pull request
# fail, and its job name is not among the required status-check contexts
# `.t-workflow/scripts/github-bootstrap.sh` sets. It reports; it does not gate.
name: Sonar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — Sonar reads full history for its new-code period and blame data.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build with coverage and upload to SonarQube
        env:
          # Repository secrets, deliberately not environment secrets: this job declares
          # no `environment:` key, so no deployment-environment approval sits in front of
          # a manual quality scan.
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B verify sonar:sonar -Dsonar.projectKey=locklane
