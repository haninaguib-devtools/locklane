# Code quality and test coverage, automatically and on demand (#399, #909). Runs on
# pull requests and pushes to `main` plus manual dispatch from the Actions tab; it
# builds the project, measures coverage with JaCoCo, and uploads both to the
# project's SonarQube server. It reports; it does not gate: no `sonar.qualitygate.wait`,
# and its job name is not among the required status-check contexts
# `.t-workflow/scripts/github-bootstrap.sh` sets.
name: Sonar

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — Sonar reads full history for its new-code period and blame data.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Same cache ci.yml keeps for its own build step (#641): the root reactor pulls
      # in the client module, and frontend-maven-plugin downloads a fresh Node/npm and
      # reinstalls every package on every scan without it. Unconditional, unlike
      # ci.yml's step — every Sonar run builds to report quality, so there is no
      # build-input skip to gate it on.
      - name: Cache client Node/npm and node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            client/node
            client/node_modules
          key: ${{ runner.os }}-client-node-${{ hashFiles('client/package-lock.json', 'client/pom.xml') }}
      - name: Build with coverage and upload to SonarQube
        env:
          # SONAR_HOST is a repository variable, not a secret: secret values are
          # masked everywhere they appear in displayed output, which breaks links
          # (#909). SONAR_TOKEN stays a secret. This job declares no
          # `environment:` key, so no deployment-environment approval sits in
          # front of the scan.
          SONAR_HOST_URL: ${{ vars.SONAR_HOST }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B verify sonar:sonar -Dsonar.projectKey=locklane
