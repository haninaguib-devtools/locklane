# Mechanical enforcement (workflow §9): the checks AGENTS.md §Checks names, run on every
# PR and on main, plus the CONSTITUTION.md §3 gates task #30 adds (plan, blockers,
# record honesty, PR title — the cold-review gate lives in review-gate.yml, since it
# also needs the pull_request_review trigger). The job name here is a status-check
# context `.t-workflow/scripts/github-bootstrap.sh` marks required in branch protection —
# renaming it means updating that script in the same change.
#
# Every check below runs as one job with sequential steps, not one job each (#94/#113):
# GitHub Actions bills each job on its own runner rounded up to a full minute, so seven
# jobs of a few seconds' real work each billed roughly seven minutes for well under one
# minute of actual work. Steps in one job share a runner and are billed together. Each
# step below still has its own name, its own log, and its own pass/fail outcome — a
# failure in any one of them fails the job (and therefore the PR) exactly as when each
# ran as its own job — and `if: "!cancelled() && ..."` (rather than a job-level `if:`)
# keeps every later step running even after an earlier one has already failed, so a PR
# with more than one failing check still surfaces all of them in a single run.
#
# The job itself is skipped while the PR is a draft (#113): the whole work/review/fix
# window then costs zero hosted minutes, and the one run that gates a merge starts when
# `ready_for_review` fires — normally `/t-ship` marking the PR ready. A `push` event has
# no `pull_request` payload, so `github.event_name != 'pull_request'` short-circuits the
# condition true for `push: main`, which always runs regardless of any PR's draft state.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  # plan-gate, title-gate, and blockers all read issue state (body, title, blockedBy).
  issues: read

# One PR's runs supersede each other (keyed by PR number, stable across pushes); one
# main's pushes supersede each other (keyed by ref) — a superseded run is cancelled
# rather than left to bill for a result nobody will read (#113).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Real work here is seconds; ten minutes is a generous bound so a hang fails loudly
    # instead of running to GitHub's 6-hour default (#113). The line itself is a
    # docs/architecture/local-slots.md slot: a consumer with its own, slower build/test
    # step (added in the trailing slot below) raises this value inside the markers, and
    # a template sync never overwrites that override (#118).
    # <!-- local -->
    # 20, not the template's 10: this consumer's build step below runs a full
    # Maven + frontend build, and a cold-cache run needs the headroom.
    timeout-minutes: 20
    # <!-- /local -->
    steps:
      # fetch-depth: 0 for record and plan-gate below, which diff against
      # origin/$BASE_REF; the other steps don't need full history but aren't harmed by
      # it, so one shared checkout replaces what were five identical ones.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Cross-artifact document consistency
        if: "!cancelled()"
        run: ./.t-workflow/scripts/consistency-check.sh

      # CONSTITUTION.md §1.2 makes "a record rides in its PR" non-optional, and workflow
      # §1.4 prefers a rule the build enforces over one the model must remember.
      - name: A task PR carries its own task record
        if: "!cancelled() && github.event_name == 'pull_request'"
        env:
          # Both refs go through env, never straight into the script: git ref names allow
          # characters the shell would interpret.
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          # Only read in the driven-initiative branch below.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          base="origin/$BASE_REF"
          # Keep the list on disk and feed it with --stdin: `xargs` behaves differently
          # between GNU and BSD on empty input, and can batch on a very large diff.
          # core.quotePath=false so a non-ASCII path is not quoted and octal-escaped,
          # which would make the protected-surface gate below see nothing.
          git -c core.quotePath=false diff --name-only "$base"...HEAD > /tmp/changed
          count=$(grep -c . /tmp/changed || true)

          if [ "$count" -eq 0 ]; then
            echo "FAIL: this PR changes no files."
            exit 1
          fi

          # ADR-004: a driven initiative's aggregate PR to `main` comes from the fixed
          # wip/<initiative-id>-integration branch shape. It carries no record of its
          # own — the initiative issue has none (docs/workflow.md §6.1) — so instead of
          # one record matching the branch's own numeric id, check one record per
          # `Task: #<id>` line in the PR body, one per included child.
          if printf '%s' "$HEAD_REF" | grep -qE '^wip/[0-9]+-integration$'; then
            printf '%s' "$PR_BODY" > /tmp/pr-body.md
            cat /tmp/changed | bash .t-workflow/scripts/check-record.sh --multi /tmp/pr-body.md
            exit $?
          fi

          # Task branches: wip/<id>-<slug>. The id is numeric (a GitHub issue number).
          id=$(printf '%s' "$HEAD_REF" | sed -n -E 's#^wip/([0-9]+)-.+#\1#p')
          if [ -z "$id" ]; then
            echo "FAIL: branch '$HEAD_REF' is not wip/<id>-<slug>."
            exit 1
          fi
          # The bucket is computable from the id (ADR-001 §D4): rounded down to the
          # nearest 100, zero-padded to 6 digits. Checking the exact bucket is what makes
          # that claim true — any-bucket matching would let 999900/142-x.md satisfy task 142.
          bucket=$(printf '%06d' $(( (10#$id / 100) * 100 )))
          recfile=$(grep -E "^docs/tasks/${bucket}/${id}-[^/]+\.md$" /tmp/changed | head -1)
          if [ -z "$recfile" ]; then
            echo "FAIL: no docs/tasks/${bucket}/${id}-<slug>.md in this diff."
            echo "  Every task PR carries its own record (CONSTITUTION.md §1.2);"
            echo "  a record for another task, or in another bucket, does not satisfy this."
            exit 1
          fi
          echo "Found the record for task $id at $recfile — checking it is real:"
          # A record present but doctored (wrong heading/id line, missing template
          # sections) is not honest — goal item 4 of #30.
          bash .t-workflow/scripts/check-record.sh "$id" "$recfile"

      # CONSTITUTION.md §3's plan-before-protected-work rule, mechanized (goal item 1 of
      # #30): a PR whose diff touches a protected surface fails unless its issue carries
      # exactly one `## Plan` section.
      - name: A protected diff carries exactly one Plan section
        if: "!cancelled() && github.event_name == 'pull_request'"
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # ADR-004: a driven initiative's aggregate PR (wip/<id>-integration) carries no
          # `## Plan` of its own — the initiative issue never has one. Every child that
          # touched a protected surface was already plan-gated individually, on its own
          # PR against this same branch, before /t-drive merged it in (ADR-004 Decision
          # 1) — this step's check already ran, successfully, once per included child.
          if printf '%s' "$HEAD_REF" | grep -qE '^wip/[0-9]+-integration$'; then
            echo "OK: $HEAD_REF is a driven-initiative integration branch — each included child was already plan-gated individually."
            exit 0
          fi

          id=$(printf '%s' "$HEAD_REF" | sed -n -E 's#^wip/([0-9]+)-.+#\1#p')
          if [ -z "$id" ]; then
            echo "FAIL: branch '$HEAD_REF' is not wip/<id>-<slug>."
            exit 1
          fi
          gh issue view "$id" --json body -q .body > /tmp/issue-body.md
          git -c core.quotePath=false diff --name-only "origin/$BASE_REF"...HEAD |
            bash .t-workflow/scripts/check-plan-gate.sh /tmp/issue-body.md

      # /t-work Phase 3's PR title convention, mechanized (goal item 5 of #30).
      - name: The PR title starts with [<id>], matching the branch
        if: "!cancelled() && github.event_name == 'pull_request'"
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          id=$(printf '%s' "$HEAD_REF" | sed -n -E 's#^wip/([0-9]+)-.+#\1#p')
          if [ -z "$id" ]; then
            echo "FAIL: branch '$HEAD_REF' is not wip/<id>-<slug>."
            exit 1
          fi
          bash .t-workflow/scripts/check-title-gate.sh "$id" "$PR_TITLE"

      # ADR-001 §D3.2 over the native blockedBy field (ADR-003), mechanized (goal item 3
      # of #30): every blocker of the PR's issue must be closed as completed.
      # Re-evaluated on every pull_request sync/reopen/ready-for-review — the closest
      # approximation to "at merge time" available without a merge queue (see the Plan's
      # human_checks on this issue); a human who wants a fresher read before clicking
      # merge can re-run this job.
      - name: Every blocker of this task's issue is closed as completed
        if: "!cancelled() && github.event_name == 'pull_request'"
        env:
          HEAD_REF: ${{ github.head_ref }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(printf '%s' "$HEAD_REF" | sed -n -E 's#^wip/([0-9]+)-.+#\1#p')
          if [ -z "$id" ]; then
            echo "FAIL: branch '$HEAD_REF' is not wip/<id>-<slug>."
            exit 1
          fi
          # `gh api graphql`, not `gh issue view --json blockedBy`: the latter never
          # returns stateReason, needed to tell a cancelled blocker from a completed one
          # (ADR-001 §D3.2). This is the same query docs/adapters/TRACKER.md's
          # tracker:list-blockers now documents as the command for this operation (#68)
          # — kept inline here rather than shelling out to the adapter doc, since this
          # runner's gh version isn't pinned by this workflow.
          gh api graphql -f query='
            query($owner: String!, $name: String!, $num: Int!) {
              repository(owner: $owner, name: $name) {
                issue(number: $num) {
                  blockedBy(first: 100) { nodes { number state stateReason } }
                }
              }
            }' -F owner="$OWNER" -F name="$REPO_NAME" -F num="$id" \
            --jq '.data.repository.issue.blockedBy.nodes' > /tmp/blockers.json
          bash .t-workflow/scripts/check-blocker-gate.sh /tmp/blockers.json

      # Regression coverage for the plumbing behind the gates above: protected-paths.sh's
      # exit codes and quoting, the bucket math, and every check-*.sh script against
      # fixtures (Done-when 1 and 2 of #30).
      - name: Gate scripts behave correctly against fixtures
        if: "!cancelled()"
        run: ./.t-workflow/scripts/plumbing-test.sh

      # Add the project's build/test command here as a step once the stack exists —
      # AGENTS.md §Checks item 1 is the single place that names it. A consumer's own
      # steps (its build/test step, its own CI-lock manifest-check step —
      # docs/architecture/manifest.md §The CI lock) live inside the markers below, a
      # docs/architecture/local-slots.md slot: a template sync copies everything outside
      # the markers and carries this region forward unchanged (#118).
      # <!-- local -->
      # This repo's own addition, not template content: the template carries no
      # .template-manifest.json (it is not a pinned consumer) — docs/architecture/
      # manifest.md §The CI lock says each consumer wires this in itself. Task #192,
      # folded from its own job into a step here at the v0.0.8 sync.
      - name: Template-owned files match the pinned manifest
        if: "!cancelled()"
        run: ./.t-workflow/scripts/check-manifest.sh

      # AGENTS.md §Checks item 1 is the single place that names this command.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: "!cancelled()"
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test every module
        if: "!cancelled()"
        run: ./mvnw -B test
      # <!-- /local -->
