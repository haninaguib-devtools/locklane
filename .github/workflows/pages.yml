# Builds and publishes docs/site/ (only) to GitHub Pages via the Actions deployment
# flow (Deploy Pages > Build and deployment > Source: GitHub Actions), never the
# "deploy from a branch, serve /docs" mode — that mode would publish the rest of docs/
# (ADRs, architecture, task records) unfiltered.
#
# GitHub Pages needs either a public repository or a paid plan to serve from a private
# one (see the repo's Settings > Pages), so on this private repo a run of this workflow
# will not actually publish anything reachable yet — see docs/tasks/000200/276-*.md.
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
