# This project's build. Written once by t-workflow's installer from the old workflow's
# slot; it is this project's own file and no update touches it.
name: build
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The lifecycle harness (#678): stub launchctl/systemctl/gh/kill drive
      # scripts/locklane -- the installed control program -- through every stop,
      # escalation, uninstall, refusal and migration scenario in a scratch HOME. It
      # takes seconds and touches no real service manager, so it runs on every PR
      # regardless of whether the diff has a build input.
      - name: Lifecycle scripts behave under stub service managers
        if: "!cancelled()"
        run: bash scripts/tests/lifecycle/run.sh
      # AGENTS.md §Checks item 1 is the single place that names the build command, and
      # scripts/build-inputs.sh is the single place that names what Maven builds (#602,
      # ADR-109 D3): on a pull request the two steps below run only when the diff
      # touches a build input, and are skipped — leaving this job, and so the required
      # `checks` context, green — when it does not. A push to main always builds: it
      # has no PR base to diff against, and every merge gets the full run its PR may
      # have skipped. The script's exit 2 ("nothing was decided") builds too — the
      # skip is only ever taken on a positive answer.
      - name: Decide whether the diff touches a build input
        id: build-inputs
        if: "!cancelled()"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "$EVENT_NAME event: always build."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rc=0
          ./scripts/build-inputs.sh "origin/$BASE_REF" || rc=$?
          case "$rc" in
            0) echo "Build inputs changed (listed above): building."
               echo "run=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "No build input in this diff: skipping setup-java and the Maven build."
               echo "run=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "build-inputs.sh could not decide (exit $rc): building."
               echo "run=true" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: "!cancelled() && steps.build-inputs.outputs.run == 'true'"
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Caches the isolated Node/npm binary and installed npm packages
      # frontend-maven-plugin downloads into client/node and client/node_modules on
      # every run — mirrors setup-java's own `cache: maven` above for the client
      # module's build, which that cache doesn't cover. Keyed on the lockfile plus
      # pom.xml, since the plugin's Node/npm version lives in the pom's <properties>,
      # not the lockfile. Task #640.
      - name: Cache client Node/npm and node_modules
        if: "!cancelled() && steps.build-inputs.outputs.run == 'true'"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            client/node
            client/node_modules
          key: ${{ runner.os }}-client-node-${{ hashFiles('client/package-lock.json', 'client/pom.xml') }}
      - name: Build and test every module
        if: "!cancelled() && steps.build-inputs.outputs.run == 'true'"
        run: ./mvnw -B test
