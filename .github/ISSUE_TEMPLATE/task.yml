# Mirrors /t-open's body template (.claude/skills/t-open/SKILL.md — the source of
# truth) per docs/architecture/issue-templates.md. Change the skill first.
#
# Parent and blocked-by are native tracker relations (ADR-003), not body fields — a
# form can prefill the body but not the relation graph, so a hand-opened issue gets
# these set afterward in the tracker's own sidebar (parent / linked issues).
name: Task
description: One deliverable, one PR. The shape /t-open produces.
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: "One paragraph. Self-sufficient: a fresh session must be able to work the task from this issue alone."
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: "Observable, checkable criteria."
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: Scope
      description: "One line: the paths or area this may touch."
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: "Explicit exclusions. Each deferred item gets its own issue — open it now."
