<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LockLane</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f7e9e2">
  <!-- #836: overwrites the accent CSS variables and the theme-color meta above from
       the stored accent color (locklane.accentTheme), synchronously, before Angular
       bootstraps -- so an installed PWA window's window-controls-overlay strip is the
       chosen accent from the very first paint on reload instead of flashing this
       file's static default above until AccentThemeStore's constructor (which still
       runs, and still owns every later update -- picking a color in Settings, or one
       picked in another tab/window) catches up. Must run after the meta tag above so
       `querySelector` finds it (the parser hasn't reached anything below this point
       yet) and before any stylesheet or the app bundle. The blend below is a twin of
       accent-theme-store.ts's own derivation (itself project-accent-tint.ts's ~13%
       blend-with-white) -- kept in sync by hand, since this script must run
       standalone, before any app bundle exists to import from (#843). -->
  <script>
    (function () {
      var DEFAULT_ACCENT = '#c15f3c';
      var accent = DEFAULT_ACCENT;
      try {
        var stored = localStorage.getItem('locklane.accentTheme');
        if (stored && /^#[0-9a-fA-F]{6}$/.test(stored)) {
          accent = stored;
        }
      } catch {
        // Storage unavailable (private browsing, quota) -- the default accent stands.
      }
      function blend(channel) {
        return Math.round(255 * (1 - 0.13) + channel * 0.13);
      }
      var accentSoft = 'rgb(' +
        blend(parseInt(accent.slice(1, 3), 16)) + ', ' +
        blend(parseInt(accent.slice(3, 5), 16)) + ', ' +
        blend(parseInt(accent.slice(5, 7), 16)) + ')';
      var root = document.documentElement;
      root.style.setProperty('--accent', accent);
      root.style.setProperty('--accent-soft', accentSoft);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) {
        meta.setAttribute('content', accentSoft);
      }
    })();
  </script>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LockLane">
</head>
<body>
  <app-root></app-root>
</body>
</html>
