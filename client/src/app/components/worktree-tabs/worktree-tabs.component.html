<div class="tabs" role="tablist">
  @for (id of worktreeIds; track id) {
    <button
      type="button"
      role="tab"
      class="tab"
      [class.active]="id === selected"
      [attr.aria-selected]="id === selected"
      (click)="select(id)"
    >
      {{ id }}
    </button>
  }
  @if (worktreeIds.length === 0) {
    <span class="empty">no worktree sessions yet for this issue</span>
  }
</div>
