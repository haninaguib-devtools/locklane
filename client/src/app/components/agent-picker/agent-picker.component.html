<div class="picker-group">
  <span class="picker-label">agent</span>
  <button type="button" [class.chosen]="agent === 'claude'" (click)="choose('claude')">claude</button>
  <button type="button" [class.chosen]="agent === 'codex'" (click)="choose('codex')">codex</button>
  <button type="button" [class.chosen]="agent === 'shell'" (click)="choose('shell')">shell</button>
</div>
