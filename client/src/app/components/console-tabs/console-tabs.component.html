<div class="tabs" role="tablist">
  @if (overview) {
    <span class="tab-wrap" [class.active]="overviewId === selected">
      <button
        type="button"
        role="tab"
        class="tab"
        [class.active]="overviewId === selected"
        [attr.aria-selected]="overviewId === selected"
        (click)="select(overviewId)"
      >
        Overview
      </button>
    </span>
  }
  @for (tab of tabs; track tab.id) {
    <span class="tab-wrap" [class.active]="tab.id === selected">
      @if (renamingId === tab.id) {
        <!-- #393: the label becomes a field in place. Enter commits, Escape abandons,
             and clicking away commits too -- the same as leaving any inline edit. -->
        <input
          #nameInput
          class="tab-name"
          type="text"
          [attr.maxlength]="maxNameLength"
          aria-label="console tab name"
          [value]="draftName"
          (input)="onRenameInput($any($event.target).value)"
          (click)="$event.stopPropagation()"
          (blur)="commitRename()"
          (keydown.enter)="commitRename()"
          (keydown.escape)="cancelRename()"
        />
      } @else {
        <button
          type="button"
          role="tab"
          class="tab"
          [class.active]="tab.id === selected"
          [attr.aria-selected]="tab.id === selected"
          [attr.title]="renamable ? 'double-click to rename' : null"
          (click)="select(tab.id)"
          (dblclick)="startRename(tab, $event)"
        >
          {{ tabText(tab) }}
        </button>
      }
      <button
        type="button"
        class="tab-shell"
        aria-label="open a shell at this console's worktree"
        (click)="openShellAt(tab, $event)"
      >
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
          <rect
            x="1.5"
            y="2.5"
            width="13"
            height="11"
            rx="1.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.2"
          />
          <path
            d="M4 6l2.5 2L4 10"
            fill="none"
            stroke="currentColor"
            stroke-width="1.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path d="M8 10.5h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
        </svg>
      </button>
      <button
        type="button"
        class="tab-reveal"
        aria-label="reveal in file manager"
        (click)="revealTab(tab.id, $event)"
      >
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
          <path
            d="M1.5 4a1 1 0 0 1 1-1h3.379a1 1 0 0 1 .707.293L7.914 4.5H13.5a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1V4z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.2"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <button
        type="button"
        class="tab-close"
        aria-label="close console tab"
        (click)="closeTab(tab.id, $event)"
      >
        ×
      </button>
    </span>
  }
  @if (showOpenButton) {
    <div class="plus-wrap">
      <button
        type="button"
        class="plus"
        [disabled]="starting"
        aria-label="open a new console"
        (click)="plusClicked()"
      >
        {{ starting ? '…' : openLabel }}
      </button>
    </div>
  }
</div>

@if (shellOpenFailed) {
  <div class="shell-error">could not open a shell at that console's worktree — try again</div>
}

@if (pendingCloseId !== null) {
  <app-confirm-dialog
    title="Close console?"
    message="Close this console? The session will be terminated and cannot be reattached."
    confirmLabel="Close"
    [danger]="true"
    (confirmed)="confirmClose()"
    (cancelled)="cancelClose()"
  />
}
