<div class="tabs" role="tablist">
  @if (overview) {
    <span class="tab-wrap" [class.active]="overviewId === selected">
      <button
        type="button"
        role="tab"
        class="tab"
        [class.active]="overviewId === selected"
        [attr.aria-selected]="overviewId === selected"
        (click)="select(overviewId)"
      >
        Overview
      </button>
    </span>
  }
  @for (tab of tabs; track tab.id) {
    <span class="tab-wrap" [class.active]="tab.id === selected">
      <button
        type="button"
        role="tab"
        class="tab"
        [class.active]="tab.id === selected"
        [attr.aria-selected]="tab.id === selected"
        (click)="select(tab.id)"
      >
        {{ tab.label }}
      </button>
      <button
        type="button"
        class="tab-close"
        aria-label="close console tab"
        (click)="closeTab(tab.id, $event)"
      >
        ×
      </button>
    </span>
  }
  <div class="plus-wrap">
    <button
      type="button"
      class="plus"
      [disabled]="starting"
      [attr.aria-expanded]="pickerOpen"
      aria-label="open a new console"
      (click)="togglePicker()"
    >
      {{ starting ? '…' : '+' }}
    </button>

    @if (pickerOpen) {
      <div class="picker">
        @if (locationChoice) {
          <div class="picker-group">
            <span class="picker-label">where</span>
            <button type="button" (click)="chooseLocation('worktree')">worktree</button>
            <button type="button" (click)="chooseLocation('main')">main</button>
          </div>
        } @else {
          <app-agent-picker [agent]="agent" (agentChange)="agent = $event" />
          <button type="button" class="picker-open" (click)="confirmOpen()">open</button>
        }
      </div>
    }
  </div>
</div>
