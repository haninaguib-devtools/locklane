<div class="tabs" role="tablist">
  @if (overview) {
    <span class="tab-wrap" [class.active]="overviewId === selected">
      <button
        type="button"
        role="tab"
        class="tab"
        [class.active]="overviewId === selected"
        [attr.aria-selected]="overviewId === selected"
        (click)="select(overviewId)"
      >
        Overview
      </button>
    </span>
  }
  @for (tab of tabs; track tab.id) {
    <span class="tab-wrap" [class.active]="tab.id === selected">
      <button
        type="button"
        role="tab"
        class="tab"
        [class.active]="tab.id === selected"
        [attr.aria-selected]="tab.id === selected"
        (click)="select(tab.id)"
      >
        {{ tab.label }}
      </button>
      <button
        type="button"
        class="tab-close"
        aria-label="close console tab"
        (click)="closeTab(tab.id, $event)"
      >
        ×
      </button>
    </span>
  }
  @if (showOpenButton) {
    <div class="plus-wrap">
      <button
        type="button"
        class="plus"
        [disabled]="starting"
        [attr.aria-expanded]="locationChoice && pickerOpen"
        aria-label="open a new console"
        (click)="plusClicked()"
      >
        {{ starting ? '…' : openLabel }}
      </button>

      @if (locationChoice && pickerOpen) {
        <div class="picker">
          <div class="picker-group">
            <span class="picker-label">where</span>
            <button type="button" (click)="chooseLocation('worktree')">worktree</button>
            <button type="button" (click)="chooseLocation('main')">main</button>
          </div>
        </div>
      }
    </div>
  }
</div>

@if (pendingCloseId !== null) {
  <app-confirm-dialog
    title="Close console?"
    message="Close this console? The session will be terminated and cannot be reattached."
    confirmLabel="Close"
    [danger]="true"
    (confirmed)="confirmClose()"
    (cancelled)="cancelClose()"
  />
}
