<div class="tabs" role="tablist">
  @if (overview) {
    <span class="tab-wrap" [class.active]="overviewId === selected">
      <button
        type="button"
        role="tab"
        class="tab"
        [class.active]="overviewId === selected"
        [attr.aria-selected]="overviewId === selected"
        (click)="select(overviewId)"
      >
        Overview
      </button>
    </span>
  }
  @for (tab of tabs; track tab.id) {
    <span class="tab-wrap" [class.active]="tab.id === selected">
      @if (renamingId === tab.id) {
        <!-- #393: the label becomes a field in place. Enter commits, Escape abandons,
             and clicking away commits too -- the same as leaving any inline edit. -->
        <input
          #nameInput
          class="tab-name"
          type="text"
          [attr.maxlength]="maxNameLength"
          aria-label="tab name"
          [value]="draftName"
          (input)="onRenameInput($any($event.target).value)"
          (click)="$event.stopPropagation()"
          (blur)="commitRename()"
          (keydown.enter)="commitRename()"
          (keydown.escape)="cancelRename()"
        />
      } @else {
        <button
          type="button"
          role="tab"
          class="tab"
          [class.active]="tab.id === selected"
          [attr.aria-selected]="tab.id === selected"
          [attr.title]="tabTitle(tab.id)"
          [attr.aria-label]="isWaiting(tab.id) ? tabText(tab) + ', waiting for you' : null"
          (click)="select(tab.id)"
          (dblclick)="startRename(tab, $event)"
        >
          <!-- #791: blue while the agent is open, amber and pulsing while it is waiting
               for the user -- the sidenav's per-issue dot, on the tab itself. Decorative:
               the button's title and accessible name carry the state in words. -->
          <span class="tab-dot" [class.waiting]="isWaiting(tab.id)" aria-hidden="true"></span>
          {{ tabText(tab) }}
        </button>
      }
      <button
        type="button"
        class="tab-close-quick"
        [attr.aria-label]="'close ' + (tab.kind === 'shell' ? 'shell' : 'agent') + ' tab'"
        (click)="closeTab(tab.id, $event)"
      >
        ×
      </button>
      <div class="tab-menu-wrap">
        <button
          type="button"
          class="tab-menu-trigger"
          aria-label="tab actions"
          (click)="toggleMenu(tab.id, $event)"
        >
          ⋮
        </button>
        @if (isMenuOpen(tab.id)) {
          <div class="tab-menu" role="menu">
            @if (isLocalHost) {
              <button
                type="button"
                role="menuitem"
                class="tab-reveal"
                (click)="revealTab(tab.id, $event)"
              >
                Folder
              </button>
            }
            <button
              type="button"
              role="menuitem"
              class="tab-open-ide"
              (click)="openIdeAt(tab, $event)"
            >
              {{ ideLabel }}
            </button>
            <button
              type="button"
              role="menuitem"
              class="tab-close"
              (click)="closeTab(tab.id, $event)"
            >
              Close
            </button>
          </div>
        }
      </div>
    </span>
  }
  <app-agent-shell-picker
    ariaLabel="open a new agent or shell"
    [label]="starting ? '…' : '+'"
    [disabled]="starting"
    [installedAgents]="installedAgents"
    [defaultAgent]="defaultAgent"
    [offerAgent]="offerAgent"
    (pickAgent)="onPickAgent($event)"
    (pickShell)="onPickShell()"
    (openedChange)="onPickerOpenedChange($event)"
  />
</div>

@if (ideOpenFailed) {
  <div class="ide-error">could not open the IDE for that agent — try again</div>
}

@if (pendingCloseId !== null) {
  <app-confirm-dialog
    [title]="closeTitle"
    [message]="closeMessage"
    [confirmLabel]="'Close'"
    [danger]="true"
    (confirmed)="confirmClose()"
    (cancelled)="cancelClose()"
  />
}
