<div class="header">
  <h1>
    @if (issueUrl) {
      <a [href]="issueUrl" target="_blank" rel="noopener">{{ issue.title }}</a>
    } @else {
      {{ issue.title }}
    }
    <span class="number">#{{ issue.number }}</span>
  </h1>
  @if (shortDescription) {
    <p class="description">{{ shortDescription }}</p>
  }
  @if (issue.labels.length) {
    <ul class="tags">
      @for (label of issue.labels; track label) {
        <li class="tag">{{ label }}</li>
      }
    </ul>
  }
</div>
