@if (issue) {
  <app-issue-header [issue]="issue" />
  @if (detail) {
    <app-flow-strip [steps]="detail.flowSteps" />
  }
  <app-console-tabs
    [tabs]="tabs"
    [selected]="activeTab"
    [starting]="starting"
    (selectedChange)="onTabSelected($event)"
    (open)="openConsole($event)"
    (close)="closeConsole($event)"
  />
  @if (startError) {
    <div class="action-error">could not open a console — try again</div>
  }
  @if (closeError) {
    <div class="action-error">could not close that console — try again</div>
  }
  <app-overview-tab
    [class.tab-hidden]="activeTab !== overviewId"
    [issue]="issue"
    [detail]="detail"
    [repoWebUrl]="repoWebUrl"
    [sessions]="resumeSessions"
    [busy]="starting"
    (reopen)="reopenSession($event)"
  />
  @for (console of consoles; track console.id) {
    <app-terminal
      [class.tab-hidden]="console.id !== activeTab"
      [sessionId]="console.id"
      [dir]="console.dir"
      [cmd]="console.agent"
      [resume]="console.resume"
      [active]="console.id === activeTab"
    />
  }
} @else {
  <div class="loading">loading issue #{{ issueNumber }}…</div>
}
