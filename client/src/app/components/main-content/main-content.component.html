@if (issue) {
  <app-issue-header [issue]="issue" [detail]="detail" />
  @if (detail) {
    <app-flow-strip [steps]="detail.flowSteps" />
  }
  <app-console-tabs
    [tabs]="tabs"
    [selected]="selectedConsole"
    [starting]="starting"
    (selectedChange)="selectConsole($event)"
    (open)="openConsole($event)"
    (close)="closeConsole($event)"
  />
  @if (startError) {
    <div class="start-error">could not open a console — try again</div>
  }
  @for (console of consoles; track console.id) {
    <app-terminal
      [class.tab-hidden]="console.id !== selectedConsole"
      [sessionId]="console.id"
      [dir]="console.dir"
      [cmd]="console.agent"
      [active]="console.id === selectedConsole"
    />
  }
  @if (consoles.length === 0) {
    <div class="no-session">no live console for this issue yet</div>
  }
} @else {
  <div class="loading">loading issue #{{ issueNumber }}…</div>
}
