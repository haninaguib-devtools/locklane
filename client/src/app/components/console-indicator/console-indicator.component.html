@if (entries().length; as count) {
  <div class="indicator">
    <button
      #trigger
      type="button"
      class="badge"
      [class.waiting]="hasWaitingEntry()"
      aria-haspopup="dialog"
      [attr.aria-expanded]="open()"
      [attr.aria-label]="
        'Open consoles, ' + count + ' ' + (count === 1 ? 'session' : 'sessions') + (hasWaitingEntry() ? ', waiting for you' : '')
      "
      (click)="onTriggerClick()"
    >
      <span class="dot" aria-hidden="true"></span>
      {{ count === 1 ? 'console' : 'consoles (' + count + ')' }}
    </button>

    @if (open()) {
      <div class="scrim" (click)="close()"></div>

      <div class="picker" role="dialog" aria-modal="true" aria-labelledby="console-picker-title">
        <div class="picker-head">
          <div>
            <h2 id="console-picker-title">Open consoles</h2>
            <p>Choose a console to jump back into.</p>
          </div>
          <kbd class="keycap">esc</kbd>
        </div>

        <div
          #results
          class="session-results"
          role="listbox"
          tabindex="0"
          [attr.aria-activedescendant]="'console-row-' + selected()"
          (keydown)="onKey($event)"
        >
          @for (group of groups(); track group.projectId) {
            @if (showGroupHeadings()) {
              <div class="group-heading">{{ group.projectName }}</div>
            }
            @for (item of group.entries; track item.entry.sessionId) {
              <button
                type="button"
                class="entry"
                role="option"
                [id]="'console-row-' + item.index"
                [attr.aria-selected]="item.index === selected()"
                [class.selected]="item.index === selected()"
                (mouseenter)="selected.set(item.index)"
                (click)="jumpTo(item.entry)"
              >
                <span class="issue ellipsis">
                  @if (item.entry.issueNumber !== null) {
                    #{{ item.entry.issueNumber }} {{ item.entry.title }}
                  } @else {
                    {{ item.entry.title }}
                  }
                </span>
              </button>
            }
          }
        </div>
      </div>
    }
  </div>
}
