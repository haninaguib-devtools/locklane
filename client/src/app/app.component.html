@if (!isLoggedIn()) {
  <app-login />
} @else {
  <div class="authed">
    <div class="topbar">
      <div class="brand">LockLane</div>
      <div class="topbar-actions">
        @if (selectedProjectId(); as projectId) {
          <app-console-indicator [projectId]="projectId" />
        }
        <button type="button" class="logout" (click)="logout()">Log out</button>
      </div>
    </div>
    <div class="shell">
      <aside class="sidebar" [style.width.px]="sidebarWidth">
        <app-sidenav
          [selected]="selectedTarget()"
          [selectedProject]="selectedIssue() === null ? selectedProjectId() : null"
          (selectedChange)="select($event)"
          (projectSelected)="selectProject($event)"
        />
      </aside>
      <app-sidebar-resizer [width]="sidebarWidth" (widthChange)="setSidebarWidth($event)" />
      @if (selectedProjectId(); as projectId) {
        @if (selectedIssue(); as issue) {
          <app-main-content [projectId]="projectId" [issueNumber]="issue" />
        } @else {
          <app-project-summary [projectId]="projectId" />
        }
      } @else {
        <div class="empty-state">select a project to begin</div>
      }
    </div>
  </div>
}
