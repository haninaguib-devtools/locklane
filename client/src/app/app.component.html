@if (!isLoggedIn()) {
  <app-login />
} @else {
  <div class="authed">
    <div class="topbar">
      <div class="brand">LockLane</div>
      <div class="topbar-actions">
        <app-console-indicator />
        <button type="button" class="logout" (click)="logout()">Log out</button>
      </div>
    </div>
    <div class="shell">
      <aside class="sidebar" [style.width.px]="sidebarWidth">
        <app-sidenav [selected]="selectedIssue()" (selectedChange)="select($event)" />
      </aside>
      <app-sidebar-resizer [width]="sidebarWidth" (widthChange)="setSidebarWidth($event)" />
      @if (selectedIssue(); as issue) {
        <app-main-content [issueNumber]="issue" />
      } @else {
        <div class="empty-state">select an issue to begin</div>
      }
    </div>
  </div>
}
