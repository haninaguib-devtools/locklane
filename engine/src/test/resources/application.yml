# Boot resolves classpath:/application.yml to a single file — test-classes comes
# before classes on the test classpath, so this REPLACES src/main/resources/
# application.yml entirely for tests rather than merging with it. Every setting the
# app needs at runtime has to be repeated here, not just the ones being overridden.
spring:
  flyway:
    locations: classpath:db/migration,classpath:dev/locklane/engine/persistence/migration
    # See src/main/resources/application.yml — a leftover locklane-engine-test
    # directory from before this task is exactly the "tables but no history table"
    # case this exists to survive.
    baseline-on-migrate: true
    baseline-version: 0

locklane:
  # Keep tests out of the real home directory.
  data-dir: ${java.io.tmpdir}/locklane-engine-test
  workarea-root: ${locklane.data-dir}/workareas
  security:
    bootstrap-username: test-user
    bootstrap-password: test-password
    allowed-origins: http://allowed-test-origin.example
  uploads:
    # See src/main/resources/application.yml (#436) -- kept under the test data-dir
    # so tests never write into a real home directory.
    dir: ${locklane.data-dir}/uploads
    max-file-bytes: 10485760
  terminal:
    # Short so any integration test that stays connected long enough exercises a real
    # ping/pong cycle rather than never seeing one (#279); see src/main/resources/application.yml.
    heartbeat-interval-ms: 1000
  release-check:
    # Never actually queried in tests (ReleaseUpdateChecker's tests call check()
    # directly rather than through gh) -- only present so the property placeholder
    # resolves at context startup. See src/main/resources/application.yml.
    repository: test-owner/test-repo
    # Long enough that no @SpringBootTest run ever sees the scheduler fire.
    interval-ms: 3600000
  worktree-cleanup:
    # See src/main/resources/application.yml -- WorktreeCleanupSweeperTest calls
    # sweep() directly rather than through the scheduler, so this only needs to be
    # long enough that no @SpringBootTest run ever sees it fire.
    interval-ms: 3600000
