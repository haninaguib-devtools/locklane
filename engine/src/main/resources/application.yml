logging:
  level:
    # Overridable from ~/.locklane/application-locklane.properties (the same
    # profile-specific file install.sh writes) without needing to know this key
    # exists — see docs/architecture/logging.md.
    dev.locklane: INFO

spring:
  application:
    name: locklane-engine
  # install.sh (#289) writes ~/.locklane/application-locklane.properties; activating
  # this profile is what makes a plain `java -jar locklane.jar` run from ~/.locklane
  # pick that file up automatically (Spring Boot searches the current directory for
  # profile-specific config in the same locations as application.yml itself).
  profiles:
    active: locklane
  flyway:
    # The schema (#107): versioned migrations that each apply exactly once, in order,
    # to whatever state a database is already in. SQL files live under the standard
    # db/migration/ (required to sit under engine/src/main/resources/); a handful of
    # column-adding steps are Java migrations instead, because SQLite has no
    # conditional ADD COLUMN — those live under persistence/migration/ to stay inside
    # that package's normal scope rather than the unrelated top-level db.migration one
    # Java-based migrations would otherwise need.
    locations: classpath:db/migration,classpath:dev/locklane/engine/persistence/migration
    # Flyway refuses to run at all against a database that already has tables but no
    # flyway_schema_history — exactly what every pre-Flyway installation looks like.
    # Baselining at version 0 (below every real migration) does not skip any of them:
    # it only tells Flyway to trust this database and start counting from zero, so V1
    # onward still run for real — and each is written to be a no-op if its own change
    # already happened. That is what makes an old database really gain the columns
    # it's missing, not just get stamped as caught up.
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    # Spring's default multipart ceiling is 1MB — below locklane.uploads.max-file-bytes,
    # so console-terminal uploads (#436) would be cut off by the container before the
    # endpoint's own cap check could give its clear 413. Held a little above that cap:
    # anything between the two still gets the endpoint's message; anything past this
    # is rejected by the container and mapped to the same 413.
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB

locklane:
  # Where the engine keeps its own durable state (currently: the SQLite database, and
  # the encryption key file (#47) alongside it).
  data-dir: ${user.home}/.locklane
  # Where added projects (#42) are cloned, one subfolder per project.
  workarea-root: ${locklane.data-dir}/workareas
  github:
    # The client id of the OAuth App behind the GitHub accounts page's "Sign in with
    # GitHub" button (#550). The shipped default is the registered "Locklane" OAuth
    # App (device flow enabled), so a plain install signs in with no configuration
    # at all (#590). A fork, or a host that registered its own app, overrides it with
    # the LOCKLANE_GITHUB_OAUTH_CLIENT_ID env var or by setting this key in
    # ~/.locklane/application-locklane.properties; blank makes device flow
    # unavailable and the accounts page offers only pasting a token. Never a secret
    # (an OAuth App's client id is public by design -- it is sent in the clear to
    # GitHub's device-code endpoint and shown in every authorization URL), so
    # committing it here is safe; no client secret exists or is needed for device flow.
    oauth-client-id: "Ov23lifzJ18NqTqgqdRn"
  uploads:
    # Files dropped or pasted onto a console terminal (#436) land here, one subfolder
    # per session id, so the CLI in that session can be handed a real path. A
    # session's subfolder is deleted when the session ends for good.
    dir: ${locklane.data-dir}/uploads
    # Uploads larger than this are refused with 413 (10 MiB — plenty for the
    # screenshots this exists for). Keep it below spring.servlet.multipart above,
    # whose container-level ceiling would otherwise answer first.
    max-file-bytes: 10485760
  security:
    # The single account created on first run if no user exists yet (#47). MUST be
    # overridden (env vars LOCKLANE_SECURITY_BOOTSTRAP_USERNAME /
    # LOCKLANE_SECURITY_BOOTSTRAP_PASSWORD) before this is ever reachable off localhost.
    bootstrap-username: admin
    bootstrap-password: changeme
    # install.sh (#384) starts the jar once with this true, and the two values above
    # in the environment, so the account is created while the installer still has the
    # password the person typed -- nothing is written to
    # application-locklane.properties. Such a run seeds the account and stops; every
    # ordinary run leaves this false and carries on serving.
    seed-only: false
    # Comma-separated origins allowed to open a /ws/sessions/** connection (#50).
    # Defaults cover local dev only (the Angular dev server via proxy.conf.json, and
    # the bundled jar's own port) — override for any real deployment.
    allowed-origins: http://localhost:4200,http://localhost:8080,https://locklane.javalib.dev
  terminal:
    # How often dev.locklane.engine.ws.TerminalWebSocketHandler pings each live
    # /ws/sessions/* connection (#279) -- a session that misses two of these in a row
    # is presumed dead (a backgrounded tab throttled by the browser, or a network
    # device silently dropping an idle connection) and closed, so the client finally
    # gets a `close` event to reconnect on.
    heartbeat-interval-ms: 20000
  release-check:
    # This repo's own owner/name (#287), for `gh release view --repo` to check for a
    # newer permanent release than the one running. Explicit rather than relying on
    # gh's cwd-based auto-detection, since the packaged jar is not guaranteed to run
    # inside a git checkout of this repo at all.
    repository: haninaguib-devtools/locklane
    # How often dev.locklane.engine.github.ReleaseUpdateChecker checks for a newer
    # permanent release (#287) -- releases are infrequent, so this is deliberately far
    # coarser than the terminal heartbeat or the per-project issue refresh above.
    interval-ms: 3600000
  worktree-cleanup:
    # How often dev.locklane.engine.persistence.WorktreeCleanupSweeper re-evaluates
    # every console-created worktree for automatic removal (#319, ADR-102's carve-out
    # of ADR-005) -- coarse on purpose: a worktree only ever becomes eligible once its
    # issue is closed, so there is no benefit to checking faster than a human is
    # likely to close issues.
    interval-ms: 900000
