spring:
  application:
    name: locklane-engine
  sql:
    init:
      # Boot only auto-runs schema.sql for what it detects as an embedded database;
      # a file-based SQLite DataSource needs this said explicitly. schema.sql uses
      # CREATE TABLE IF NOT EXISTS, so running it on every startup is idempotent.
      mode: always

locklane:
  # Where the engine keeps its own durable state (currently: the SQLite database, and
  # the encryption key file (#47) alongside it).
  data-dir: ${user.home}/.locklane
  # The repo root, for reading docs/tasks/ (#16). Default assumes the process is
  # started with engine/ as the working directory (true for `mvn spring-boot:run`
  # from the repo root, or `mvn -f engine/pom.xml ...`) — override this property for
  # any other launch shape (e.g. running the packaged jar from a different cwd).
  project-root: ${user.dir}/..
  # Where added projects (#42) are cloned, one subfolder per project. Independent of
  # project-root above, which names Locklane's own checkout for its existing
  # single-project worktree feature.
  workarea-root: ${locklane.data-dir}/workareas
  security:
    # The single account created on first run if no user exists yet (#47). MUST be
    # overridden (env vars LOCKLANE_SECURITY_BOOTSTRAP_USERNAME /
    # LOCKLANE_SECURITY_BOOTSTRAP_PASSWORD) before this is ever reachable off localhost.
    bootstrap-username: admin
    bootstrap-password: changeme
    # Comma-separated origins allowed to open a /ws/sessions/** connection (#50).
    # Defaults cover local dev only (the Angular dev server via proxy.conf.json, and
    # the bundled jar's own port) — override for any real deployment.
    allowed-origins: http://localhost:4200,http://localhost:8080
